<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS Tutorials - con-03 Renderers by Level of Measurement</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: system-ui, sans-serif; }
      arcgis-map { display: block; width: 100%; height: 100%; }
      #panel {
        width: 320px; padding: 14px 16px; border-radius: 12px; color: #e9eef5; font-size: 14px;
        background: rgba(10, 18, 31, 0.88); backdrop-filter: blur(12px); box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
      }
      #panel h1 { margin: 0 0 10px; font-size: 16px; }
      #levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      #levels button {
        padding: 7px 0; border: 0; border-radius: 8px; cursor: pointer; font-size: 13px;
        background: #26344a; color: #e9eef5;
      }
      #levels button[aria-pressed="true"] { background: #ffbf0b; color: #0a121f; font-weight: 600; }
      #panel .what { margin: 10px 0 0; line-height: 1.4; }
      #panel .note { margin: 8px 0 0; font-size: 12px; color: #ffbf0b; }
      #panel .source { margin: 10px 0 0; font-size: 11px; color: #9fb0c4; }
    </style>
  </head>
  <body>
    <arcgis-map basemap="gray-vector" center="-105.55, 39.0" zoom="6">
      <section id="panel" slot="top-right" aria-label="Level of measurement">
        <h1>Colorado counties by level</h1>
        <div id="levels" role="group" aria-label="Level of measurement">
          <button id="nominal">Nominal</button>
          <button id="ordinal">Ordinal</button>
          <button id="interval">Interval</button>
          <button id="ratio">Ratio</button>
        </div>
        <p class="what" id="what"></p>
        <p class="note" id="note"></p>
        <p class="source">Data: US Census Bureau (cartographic boundary counties 1:20m 2023; population estimates
          Vintage 2024), USDA ERS Rural-Urban Continuum Codes 2023, NOAA NCEI nClimDiv county temperature.</p>
      </section>
      <arcgis-legend slot="bottom-left"></arcgis-legend>
    </arcgis-map>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
