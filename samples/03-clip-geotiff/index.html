<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS Tutorials - 03 Clip GeoTIFF</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: system-ui, sans-serif; }
      arcgis-map { display: block; width: 100%; height: 100%; }
      #panel {
        position: absolute; top: 16px; right: 16px; width: 260px; padding: 12px;
        background: #0a121f; color: #fff; border-radius: 8px; font-size: 14px;
      }
      #panel button { width: 100%; padding: 8px; font-size: 14px; cursor: pointer; }
      #status { margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <arcgis-map center="-122.19, 46.20" zoom="13"></arcgis-map>
    <div id="panel">
      <button id="draw">Draw a box</button>
      <p id="status">Draw a box to clip the elevation to a GeoTIFF.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
