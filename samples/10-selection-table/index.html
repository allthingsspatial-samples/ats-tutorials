<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS Tutorials - 10 Selection, Table and CSV</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <calcite-shell>
      <calcite-navigation slot="header">
        <calcite-navigation-logo slot="logo" heading="Select earthquakes, export a CSV" description="USGS earthquakes, about the past 90 days (Living Atlas)"></calcite-navigation-logo>
      </calcite-navigation>

      <arcgis-map id="map" basemap="gray-vector" center="-119, 38" zoom="5">
        <!-- Selection Toolbar (5.2): point, rectangle, lasso, polygon; add / remove / replace. -->
        <arcgis-selection-toolbar slot="top-start"></arcgis-selection-toolbar>
        <arcgis-zoom slot="bottom-start"></arcgis-zoom>
      </arcgis-map>

      <!-- Selection List (5.2): what is selected, per layer. -->
      <calcite-shell-panel slot="panel-end" width="m">
        <calcite-panel heading="Selection">
          <arcgis-selection-list reference-element="map"></arcgis-selection-list>
        </calcite-panel>
      </calcite-shell-panel>

      <!-- Feature Table: bound to the map's layer by id (mapLayerId, since 5.1, set in main.js). -->
      <calcite-shell-panel slot="panel-bottom" id="bottom-panel" resizable>
        <calcite-panel heading="Earthquakes" id="table-panel">
          <calcite-label slot="header-actions-end" layout="inline" class="inline-label">
            Selected only
            <calcite-switch id="selected-only"></calcite-switch>
          </calcite-label>
          <calcite-button slot="header-actions-end" id="download" icon-start="download" appearance="outline" disabled>Download CSV</calcite-button>
          <arcgis-feature-table
            id="table"
            reference-element="map"
            sync-view-selection
          ></arcgis-feature-table>
        </calcite-panel>
      </calcite-shell-panel>
    </calcite-shell>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
